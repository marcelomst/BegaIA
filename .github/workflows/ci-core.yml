name: ci-core

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm ts-check

      - name: Lint
        run: pnpm lint || true

      - name: Lint (scoped, advisory)
        run: |
          # Mientras existan warnings heredados en estas carpetas, este chequeo
          # queda solo como señal de observabilidad y no bloquea core-tests.
          npx next lint --dir app/api --dir lib/handlers --dir lib/agents --dir test || true

      - name: Run core tests
        run: pnpm test:core
