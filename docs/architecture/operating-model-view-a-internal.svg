  <title id="view-title">BegaIA Operating Model — View A — INTERNAL</title>
  <desc id="view-description">
    Derived role-architecture view of the Operating Model System. Human Authority provides direction,
    AGPT coordinates scope and context, and five specialized agents contribute architecture,
    implementation, audit, validation, documentation and traceability. Relationships are functional,
    radial and non-sequential; coordination centrality does not imply an authority hierarchy.
  </desc>

