  <title id="view-title">BegaIA Operating Model — View E — INTERNAL</title>
  <desc id="view-description">
    Derived documentation and canonical-architecture view of the Operating Model System. It distinguishes
    global contractual governance, scope-limited operational binding, current canonical architecture,
    structural decisions, navigation and templates, derived runtime and visual representations, and
    historical traceability. Authority is scoped rather than flattened into one absolute hierarchy.
  </desc>

