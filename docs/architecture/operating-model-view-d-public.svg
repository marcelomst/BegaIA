<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:begasist="https://begasist.com/ns/architecture"
     id="view-d-public"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080"
     role="img"
     aria-labelledby="view-title view-description">
  <title id="view-title">BegaIA: producto y evolución controlada</title>
  <desc id="view-description">
    BegaIA atiende al huésped y habilita operación hotelera supervisada. El
    Operating Model gobierna cómo BegaIA puede evolucionar. El equipo del hotel
    supervisa la operación diaria asistida por BegaIA, mientras que el Control
    humano autoriza y controla la evolución del producto; son funciones humanas
    distintas y no están conectadas entre sí.
  </desc>

  <metadata id="public-view-provenance">
    <begasist:provenance>
      <begasist:view_id>operating-model-view-d-public</begasist:view_id>
      <begasist:representation_status>derived_non_contractual</begasist:representation_status>
      <begasist:derived_from>docs/architecture/operating-model-view-d-internal.svg</begasist:derived_from>
      <begasist:internal_technical_commit>5adc8cfc23b7eedb2b4072e1b7f61a7a6f3314a6</begasist:internal_technical_commit>
      <begasist:internal_documentation_commit>a5915e554df3cb9841af4fe6f7ce4a668b946113</begasist:internal_documentation_commit>
      <begasist:contractual_source>docs/architecture/system_operating_model.md</begasist:contractual_source>
    </begasist:provenance>
  </metadata>

  <defs aria-hidden="true">
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#35C9BB"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#FF8FB3"/>
    </marker>
    <marker id="arrow-violet" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#C5AEFF"/>
    </marker>
    <pattern id="guest-pattern" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#35C9BB" stroke-width="2" opacity="0.13"/>
    </pattern>
    <pattern id="hotel-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#FF8FB3" opacity="0.16"/>
    </pattern>
    <style>
