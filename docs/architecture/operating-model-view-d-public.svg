      <text class="text muted" x="1120" y="884" font-size="17">Autoriza y controla</text>
      <text class="text muted" x="1120" y="907" font-size="17">cambios al producto</text>
    </g>
  </g>

  <g id="layer-relationships" role="group" aria-label="Tres relaciones públicas" data-internal-ref="R01,R10,R11,R28,R21" data-sequence="5.5">
