      .muted { fill: #BAC6D4; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.2px; }
      .system-label { font-size: 30px; font-weight: 800; letter-spacing: 1.3px; }
      .node-label { font-size: 25px; font-weight: 750; }
      .body { font-size: 19px; font-weight: 450; }
      .relation-label { font-size: 16px; font-weight: 700; letter-spacing: 0.1px; }
      .footer { font-size: 15px; font-weight: 700; letter-spacing: 1.1px; }
    </style>
  </defs>

  <g id="layer-background" role="group" aria-label="Fondo" data-internal-ref="none" data-sequence="0">
    <rect width="1920" height="1080" fill="#07111F"/>
    <circle cx="1750" cy="90" r="250" fill="#123B47" opacity="0.10" aria-hidden="true"/>
    <circle cx="150" cy="970" r="290" fill="#4B3678" opacity="0.08" aria-hidden="true"/>
  </g>

  <g id="layer-header" role="group" aria-label="Título y tesis" data-internal-ref="none" data-sequence="1">
    <g id="public-title" role="group" aria-label="Título público" data-internal-ref="none" data-sequence="1.1">
