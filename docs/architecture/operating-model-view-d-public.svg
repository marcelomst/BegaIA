      <rect x="320" y="190" width="1280" height="500" rx="34" fill="#0D2430" stroke="#35C9BB" stroke-width="4" filter="url(#soft-shadow)"/>
      <path d="M 350 276 H 1570" stroke="#35C9BB" stroke-width="2" opacity="0.35" stroke-dasharray="8 10" aria-hidden="true"/>
      <text class="text system-label" x="370" y="238">BEGAIA / PRODUCT SYSTEM</text>
      <text class="text muted body" x="370" y="266">Un único producto con dos dimensiones complementarias</text>
    </g>

    <g id="public-operating-model" class="system-boundary" role="group" aria-label="Operating Model System" data-node-type="system_boundary" data-internal-ref="O0" data-sequence="4">
      <rect x="500" y="790" width="920" height="170" rx="30" fill="#211838" stroke="#9D7BEA" stroke-width="4" filter="url(#soft-shadow)"/>
      <path d="M 990 812 V 938" stroke="#9D7BEA" stroke-width="2" opacity="0.42" stroke-dasharray="7 9" aria-hidden="true"/>
      <text class="text system-label" x="550" y="846">OPERATING MODEL SYSTEM</text>
      <text class="text muted body" x="550" y="884">Gobierna cómo BegaIA puede</text>
      <text class="text muted body" x="550" y="912">evolucionar</text>
    </g>
  </g>

  <g id="layer-product-capabilities" role="group" aria-label="Dos dimensiones del Product System" data-internal-ref="guest_interaction_group,P1-P9,P10" data-sequence="2.5">
    <g id="public-guest-interaction" role="group" aria-label="Interacción con el huésped" data-node-type="product_capability" data-system="public-product-system" data-internal-ref="guest_interaction_group,P1-P9" data-sequence="2.3">
      <rect x="410" y="310" width="520" height="250" rx="26" fill="#123B47" stroke="#55E1D4" stroke-width="3"/>
      <rect x="410" y="310" width="520" height="250" rx="26" fill="url(#guest-pattern)" aria-hidden="true"/>
      <g transform="translate(455 353)" aria-hidden="true">
        <path d="M 0 4 Q 0 0 4 0 H 42 Q 46 0 46 4 V 29 Q 46 33 42 33 H 19 L 8 43 V 33 H 4 Q 0 33 0 29 Z" fill="none" stroke="#70E9DE" stroke-width="3"/>
        <circle cx="13" cy="17" r="2.5" fill="#70E9DE"/>
        <circle cx="23" cy="17" r="2.5" fill="#70E9DE"/>
        <circle cx="33" cy="17" r="2.5" fill="#70E9DE"/>
      </g>
      <text class="text node-label" x="455" y="430">Interacción con el huésped</text>
      <text class="text" x="455" y="473" font-size="22" font-weight="700">Conversación multicanal</text>
      <text class="text muted body" x="455" y="510">Atiende consultas y acompaña gestiones</text>
    </g>

    <g id="public-hotel-operation" role="group" aria-label="Operación hotelera asistida y supervisada" data-node-type="product_capability" data-system="public-product-system" data-internal-ref="P10" data-sequence="3.3">
      <rect x="990" y="310" width="520" height="250" rx="26" fill="#38273A" stroke="#FF8FB3" stroke-width="3"/>
      <rect x="990" y="310" width="520" height="250" rx="26" fill="url(#hotel-pattern)" aria-hidden="true"/>
      <g transform="translate(1035 347)" aria-hidden="true">
        <circle cx="18" cy="15" r="11" fill="none" stroke="#FFB5CD" stroke-width="3"/>
        <path d="M 0 48 C 2 31 34 31 36 48" fill="none" stroke="#FFB5CD" stroke-width="3" stroke-linecap="round"/>
        <path d="M 44 27 L 55 38 L 75 14" fill="none" stroke="#FFB5CD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="text node-label" x="1035" y="422">Operación hotelera asistida</text>
      <text class="text node-label" x="1035" y="453">y supervisada</text>
      <text class="text muted body" x="1035" y="495">El equipo revisa, confirma e interviene</text>
      <text class="text muted body" x="1035" y="523">cuando corresponde</text>
      <text class="text" x="1035" y="551" font-size="18" font-weight="750">BegaIA asiste; no sustituye la recepción</text>
    </g>
  </g>

