      <path d="M 280 452 H 400" fill="none" stroke="#35C9BB" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
      <rect x="270" y="373" width="140" height="55" rx="16" fill="#07111F" stroke="#35C9BB" stroke-width="1.5"/>
      <text class="text relation-label" x="340" y="398" text-anchor="middle">conversa y recibe</text>
      <text class="text relation-label" x="340" y="421" text-anchor="middle">asistencia</text>
    </g>

    <g id="public-rel-hotel-team" role="group" aria-label="Equipo del hotel usa, supervisa e interviene" data-from="public-hotel-team" data-to="public-hotel-operation" data-direction="bidirectional" data-internal-ref="R28" data-sequence="3.2">
      <title>Relación bidireccional: el equipo del hotel usa, supervisa e interviene</title>
      <path d="M 1520 452 H 1640" fill="none" stroke="#FF8FB3" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow-coral)" marker-end="url(#arrow-coral)"/>
      <rect x="1510" y="373" width="140" height="55" rx="16" fill="#07111F" stroke="#FF8FB3" stroke-width="1.5"/>
      <text class="text relation-label" x="1580" y="398" text-anchor="middle">usa · supervisa</text>
      <text class="text relation-label" x="1580" y="421" text-anchor="middle">· interviene</text>
    </g>

    <g id="public-rel-governance" role="group" aria-label="El Operating Model gobierna cómo BegaIA puede evolucionar" data-from="public-operating-model" data-to="public-product-system" data-direction="one_way" data-execution-semantics="none" data-internal-ref="R21" data-sequence="5.2">
      <title>Relación unidireccional de gobierno de evolución, sin semántica de ejecución</title>
      <path d="M 960 790 V 690" fill="none" stroke="#C5AEFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrow-violet)"/>
      <rect x="1000" y="703" width="432" height="66" rx="18" fill="#131526" stroke="#9D7BEA" stroke-width="2"/>
      <text class="text relation-label" x="1022" y="729">gobierna la evolución</text>
      <text class="text muted" x="1022" y="754" font-size="16">fuera de la atención en tiempo real</text>
    </g>
  </g>

  <g id="layer-legend" role="group" aria-label="Leyenda de relaciones" data-internal-ref="R01,R10,R11,R28,R21" data-sequence="7">
    <g transform="translate(80 1000)">
      <line x1="0" y1="0" x2="52" y2="0" stroke="#35C9BB" stroke-width="4" marker-end="url(#arrow-teal)" aria-hidden="true"/>
      <text class="text muted" x="68" y="6" font-size="16">Interacción con el huésped</text>
